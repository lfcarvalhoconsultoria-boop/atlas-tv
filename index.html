<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

img {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#fullscreen {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 10;
    padding: 14px 22px;
    background: rgba(0,0,0,0.65);
    color: white;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

#fullscreen:hover {
    background: rgba(0,0,0,0.9);
}

</style>
</head>

<body>

<img src="Atlas.jpeg">

<button id="fullscreen" onclick="telaCheia()">
    ⛶ TELA CHEIA
</button>

<script>

/* ==============================
   BOTÃO DE TELA CHEIA
================================ */

const botao = document.getElementById("fullscreen");

function telaCheia() {

    const pagina = document.documentElement;

    if (pagina.requestFullscreen) {
        pagina.requestFullscreen();
    }
    else if (pagina.webkitRequestFullscreen) {
        pagina.webkitRequestFullscreen();
    }

}


/* ==============================
   ESCONDER BOTÃO EM TELA CHEIA
================================ */

function verificarTelaCheia() {

    const estaEmTelaCheia =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (estaEmTelaCheia) {
        botao.style.display = "none";
    } else {
        botao.style.display = "block";
    }

}

document.addEventListener(
    "fullscreenchange",
    verificarTelaCheia
);

document.addEventListener(
    "webkitfullscreenchange",
    verificarTelaCheia
);


/* ==============================
   ESCONDER CURSOR AUTOMATICAMENTE
================================ */

let timerMouse;

function esconderMouse() {
    document.body.style.cursor = "none";
}

function mostrarMouse() {

    document.body.style.cursor = "default";

    clearTimeout(timerMouse);

    timerMouse = setTimeout(
        esconderMouse,
        2000
    );
}

document.addEventListener(
    "mousemove",
    mostrarMouse
);

document.addEventListener(
    "mousedown",
    mostrarMouse
);

/* Ao abrir a página,
   aguarda 2 segundos e esconde */

timerMouse = setTimeout(
    esconderMouse,
    2000
);

</script>

</body>
</html>
