<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

img {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    inset: 0;
}

#fullscreen {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 10;
    padding: 14px 22px;
    background: rgba(0,0,0,0.65);
    color: white;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

#fullscreen:hover {
    background: rgba(0,0,0,0.9);
}
</style>
</head>

<body>

<img src="Atlas.jpeg">

<button id="fullscreen" onclick="telaCheia()">
    ⛶ TELA CHEIA
</button>

<script>
function telaCheia() {
    const pagina = document.documentElement;

    if (pagina.requestFullscreen) {
        pagina.requestFullscreen();
    } else if (pagina.webkitRequestFullscreen) {
        pagina.webkitRequestFullscreen();
    }
}
</script>

</body>
</html>
